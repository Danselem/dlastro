class TransitDataset(Dataset):
    def __init__(self, n=5000, seq_len=100, depth=0.5, width=10, noise=0.3):
        self.n = n
        self.seq_len = seq_len
        self.depth = depth
        self.width = width
        self.noise = noise

        self.labels = np.random.randint(0,2,size=n)
        self.data = []

            x = np.random.randn(seq_len) * noise
            if self.labels[i]==1:
                pos = np.random.randint(0, seq_len-width)
                x[pos:pos+width] -= depth
            self.data.append(x)
        self.data = np.array(self.data, dtype=np.float32)
        self.labels = self.labels.astype(np.float32)

    def __len__(self):
        return self.n

    def __getitem__(self, idx):
        # shape (1, 100) for Conv1d
        return torch.tensor(self.data[idx]).unsqueeze(0), torch.tensor(self.labels[idx])
